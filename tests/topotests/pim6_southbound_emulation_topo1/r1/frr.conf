interface r1-eth0
 description to r2
 ip address 10.0.12.1/24
 ipv6 address 2001:db8:12::1/64
 ipv6 pim
!
interface r1-eth1
 description to r3
 ip address 10.0.13.1/24
 ipv6 address 2001:db8:13::1/64
 ipv6 pim
!
interface r1-eth2
 description to h1
 ip address 192.168.1.1/24
 ipv6 address 2001:db8:1::1/64
 ipv6 mld
 ipv6 pim
