ipv6 route 2001:db8:ffff::2/128 2001:db8:12::2
ipv6 route 2001:db8:ffff::3/128 2001:db8:13::3
ipv6 route 2001:db8:23::/64 2001:db8:12::2
ipv6 route 2001:db8:3::/64 2001:db8:13::3
