log commands
!
debug pimv6 events
debug pimv6 packets register
debug pimv6 packets joins
debug mld events
!
fpm address 127.0.0.1
no fpm use-next-hop-groups
!
interface lo
 ip address 10.254.0.2/32
 ipv6 address 2001:db8:ffff::2/128
 ipv6 pim
!
interface r2-eth0
 description to r1
 ip address 10.0.12.2/24
 ipv6 address 2001:db8:12::2/64
 ipv6 pim
!
interface r2-eth1
 description to r3
 ip address 10.0.23.2/24
 ipv6 address 2001:db8:23::2/64
 ipv6 pim
!
ipv6 route 2001:db8:ffff::1/128 2001:db8:12::1
ipv6 route 2001:db8:ffff::3/128 2001:db8:23::3
ipv6 route 2001:db8:13::/64 2001:db8:12::1
ipv6 route 2001:db8:1::/64 2001:db8:12::1
ipv6 route 2001:db8:3::/64 2001:db8:23::3
!
! Embedded RP groups may only point at r3.
ipv6 prefix-list embedded-rp-groups permit ff75:330:2001:db8:ffff::/80
!
router pim6
 rp 2001:db8:ffff::2 ff00::/8
 embedded-rp
 embedded-rp group-list embedded-rp-groups
!
